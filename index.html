<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tikluycredit - Hệ Thống Duyệt Tín Dụng Tự Động</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentStep, setCurrentStep] = useState(1);
      
      // Loan Amount Selection State
      const [loanAmount, setLoanAmount] = useState(50000000);
      const [loanTerm, setLoanTerm] = useState(12);

      // Application Form State
      const [formData, setFormData] = useState({
        fullName: '',
        idCard: '',
        phone: '',
        dob: '',
        email: '',
        jobType: 'employee',
        monthlyIncome: '15000000',
        companyName: '',
        address: '',
        bankName: 'MBBank',
        bankAccount: '',
        accountHolder: ''
      });

      // Real Photo Upload State
      const [cccdFront, setCccdFront] = useState(null);
      const [cccdBack, setCccdBack] = useState(null);

      // Simulation State
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisProgress, setAnalysisProgress] = useState(0);
      const [approvalResult, setApprovalResult] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentStep, isAnalyzing, approvalResult, cccdFront, cccdBack]);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleFileUpload = (e, side) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (side === 'front') {
              setCccdFront(reader.result);
            } else {
              setCccdBack(reader.result);
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const formatVND = (num) => {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);
      };

      const triggerAutoApproval = () => {
        setIsAnalyzing(true);
        setAnalysisProgress(0);

        const interval = setInterval(() => {
          setAnalysisProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setIsAnalyzing(false);

              const resultObj = {
                id: `TK-${Math.floor(10000 + Math.random() * 90000)}`,
                fullName: formData.fullName || 'Khách hàng',
                amount: Number(loanAmount),
                term: Number(loanTerm),
                date: new Date().toISOString().split('T')[0]
              };

              setApprovalResult(resultObj);
              setCurrentStep(4);
              return 100;
            }
            return prev + 15;
          });
        }, 300);
      };

      return (
        <div>
          {/* Header */}
          <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center font-bold text-white text-xl shadow-md shadow-red-600/20">
                  TK
                </div>
                <div>
                  <h1 className="font-extrabold text-lg leading-tight tracking-wide bg-gradient-to-r from-red-600 to-rose-600 bg-clip-text text-transparent">
                    Tikluycredit
                  </h1>
                  <p className="text-xs text-slate-500">Hệ thống Duyệt Tín Dụng Tự Động</p>
                </div>
              </div>

              <div className="flex items-center gap-1.5 bg-red-50 border border-red-200 px-3 py-1.5 rounded-xl text-xs text-red-600 font-bold">
                <i data-lucide="zap" className="w-4 h-4"></i>
                Hỗ trợ 24/7
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 pt-6">
            <div className="space-y-6">
              
              {/* Banner giới thiệu ngắn gọn */}
              <div className="bg-gradient-to-br from-red-50 via-white to-rose-50 border border-red-200 rounded-2xl p-5 shadow-sm relative overflow-hidden">
                <div className="flex items-center gap-2 text-red-600 text-xs font-bold uppercase tracking-wider mb-2">
                  <i data-lucide="zap" className="w-4 h-4"></i> Tikluy AI Engine
                </div>
                <h2 className="text-xl font-bold text-slate-900 mb-2">
                  Đăng Ký Hạn Mức Vay Nhanh Từ 30 - 100 Triệu VNĐ
                </h2>
                <p className="text-slate-600 text-xs leading-relaxed">
                  Thẩm định tự động minh bạch. Không thế chấp tài sản, thủ tục trực tuyến an toàn và bảo mật tuyệt đối.
                </p>
              </div>

              {/* Main Multi-Step Form Card */}
              <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-md relative">
                
                <div className="mb-6">
                  <div className="flex justify-between items-center mb-3 text-xs">
                    <span className="font-semibold text-red-600 uppercase tracking-wider">
                      Bước {currentStep} / 4: {
                        currentStep === 1 ? 'Chọn hạn mức & Thông tin cá nhân' :
                        currentStep === 2 ? 'Việc làm & Tài khoản thụ hưởng' :
                        currentStep === 3 ? 'Xác thực định danh trực tuyến (eKYC)' : 'Hoàn tất hồ sơ'
                      }
                    </span>
                    <span className="text-slate-500 font-medium">{currentStep * 25}% Hoàn thành</span>
                  </div>
                  <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div 
                      className="bg-gradient-to-r from-red-600 to-rose-500 h-full transition-all duration-300"
                      style={{ width: `${currentStep * 25}%` }}
                    ></div>
                  </div>
                </div>

                {/* STEP 1 */}
                {currentStep === 1 && (
                  <div className="space-y-5">
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2">
                      <i data-lucide="wallet" className="w-4 h-4 text-red-600"></i> Lựa Chọn Hạn Mức & Thông Tin Định Danh
                    </h3>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                      <div className="space-y-2">
                        <div className="flex justify-between items-center text-xs">
                          <span className="text-slate-600">Số tiền đề xuất vay:</span>
                          <span className="text-red-600 font-bold text-base">
                            {formatVND(loanAmount)}
                          </span>
                        </div>
                        <input
                          type="range"
                          min="30000000"
                          max="100000000"
                          step="5000000"
                          value={loanAmount}
                          onChange={(e) => setLoanAmount(Number(e.target.value))}
                          className="w-full accent-red-600 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                        />
                        <div className="flex justify-between text-[10px] text-slate-500">
                          <span>30 Triệu</span>
                          <span>60 Triệu</span>
                          <span>100 Triệu</span>
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="text-xs text-slate-600 block">Kỳ hạn thanh toán mong muốn</label>
                        <div className="grid grid-cols-4 gap-2">
                          {[6, 12, 18, 24].map((term) => (
                            <button
                              key={term}
                              onClick={() => setLoanTerm(term)}
                              className={`py-2 text-xs font-medium rounded-xl border transition-all ${
                                loanTerm === term
                                  ? 'bg-red-600 text-white font-bold border-red-600 shadow-sm'
                                  : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                              }`}
                            >
                              {term} Tháng
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Họ và Tên (Khớp CCCD)</label>
                        <input
                          type="text"
                          name="fullName"
                          placeholder="NGUYEN VAN A"
                          value={formData.fullName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Số CCCD (12 chữ số)</label>
                        <input
                          type="text"
                          name="idCard"
                          placeholder="038090001234"
                          maxLength={12}
                          value={formData.idCard}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Số Điện Thoại Chính Chủ</label>
                        <input
                          type="tel"
                          name="phone"
                          placeholder="0987654321"
                          value={formData.phone}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Địa chỉ Email</label>
                        <input
                          type="email"
                          name="email"
                          placeholder="nguyenvana@gmail.com"
                          value={formData.email}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs text-slate-700 mb-1 block font-medium">Địa chỉ thường trú hiện tại</label>
                      <input
                        type="text"
                        name="address"
                        placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"
                        value={formData.address}
                        onChange={handleInputChange}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white"
                      />
                    </div>

                    <div className="pt-4 flex justify-end">
                      <button
                        onClick={() => setCurrentStep(2)}
                        disabled={!formData.fullName || !formData.idCard || !formData.phone}
                        className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold px-6 py-2.5 rounded-xl transition-all flex items-center gap-2 text-sm shadow-md shadow-red-600/20"
                      >
                        Tiếp Theo <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 2 */}
                {currentStep === 2 && (
                  <div className="space-y-4">
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <i data-lucide="building-2" className="w-4 h-4 text-red-600"></i> Thông Tin Việc Làm & Tài Khoản Nhận Tiền
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Hình thức công việc</label>
                        <select
                          name="jobType"
                          value={formData.jobType}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white"
                        >
                          <option value="employee">Nhân viên văn phòng / Hợp đồng lao động</option>
                          <option value="business">Kinh doanh tự do / Hộ kinh doanh</option>
                          <option value="freelance">Freelance / Lao động tự do</option>
                          <option value="driver">Tài xế công nghệ / Giao hàng</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Mức thu nhập hàng tháng</label>
                        <select
                          name="monthlyIncome"
                          value={formData.monthlyIncome}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white"
                        >
                          <option value="8000000">Dưới 10,000,000 đ</option>
                          <option value="15000000">10,000,000 - 20,000,000 đ</option>
                          <option value="25000000">20,000,000 - 35,000,000 đ</option>
                          <option value="40000000">Trên 35,000,000 đ</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Tên đơn vị công tác / Cửa hàng</label>
                        <input
                          type="text"
                          name="companyName"
                          placeholder="Tên cơ quan / công ty..."
                          value={formData.companyName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Ngân hàng thụ hưởng giải ngân</label>
                        <select
                          name="bankName"
                          value={formData.bankName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white"
                        >
                          <optgroup label="Ngân hàng TMCP lớn">
                            <option value="MBBank">MBBank - Ngân hàng Quân Đội</option>
                            <option value="VPBank">VPBank - Ngân hàng Thịnh Vượng</option>
                            <option value="Techcombank">Techcombank - Kỹ Thương</option>
                            <option value="Vietcombank">Vietcombank - Ngoại Thương</option>
                            <option value="ACB">ACB - Ngân hàng Á Châu</option>
                            <option value="TPBank">TPBank - Tiên Phong</option>
                            <option value="BIDV">BIDV - Đầu Tư và Phát Triển</option>
                            <option value="Agribank">Agribank - Nông Nghiệp</option>
                            <option value="VietinBank">VietinBank - Công Thương</option>
                            <option value="Sacombank">Sacombank - Sài Gòn Thương Tín</option>
                            <option value="SHB">SHB - Sài Gòn - Hà Nội</option>
                            <option value="VIB">VIB - Quốc Tế</option>
                            <option value="HDBank">HDBank - Phát Triển TP.HCM</option>
                            <option value="MSB">MSB - Hàng Hải</option>
                            <option value="OCB">OCB - Phương Đông</option>
                            <option value="SeABank">SeABank - Đông Nam Á</option>
                            <option value="Eximbank">Eximbank - Xuất Nhập Khẩu</option>
                            <option value="LPBank">LPBank - Lộc Phát</option>
                          </optgroup>
                          <optgroup label="Ngân hàng số & Tổ chức tài chính">
                            <option value="CakeByVPBank">Cake by VPBank</option>
                            <option value="Timo">Timo by Ban Viet</option>
                            <option value="UBank">Ubank by VPBank</option>
                            <option value="ShinhanFinance">Shinhan Finance</option>
                            <option value="LotteFinance">Lotte Finance</option>
                            <option value="FECredit">FE Credit</option>
                            <option value="HomeCredit">Home Credit</option>
                          </optgroup>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Số tài khoản ngân hàng chính chủ</label>
                        <input
                          type="text"
                          name="bankAccount"
                          placeholder="Nhập số tài khoản..."
                          value={formData.bankAccount}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-700 mb-1 block font-medium">Tên chủ tài khoản (Viết hoa không dấu)</label>
                        <input
                          type="text"
                          name="accountHolder"
                          placeholder="VD: NGUYEN VAN A"
                          value={formData.accountHolder}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 uppercase focus:bg-white"
                        />
                      </div>
                    </div>

                    <div className="pt-4 flex justify-between">
                      <button
                        onClick={() => setCurrentStep(1)}
                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-2.5 rounded-xl text-sm"
                      >
                        Quay lại
                      </button>
                      <button
                        onClick={() => setCurrentStep(3)}
                        disabled={!formData.bankAccount || !formData.accountHolder}
                        className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 text-sm shadow-md shadow-red-600/20"
                      >
                        Tiếp Theo <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 3 */}
                {currentStep === 3 && (
                  <div className="space-y-4">
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <i data-lucide="credit-card" className="w-4 h-4 text-red-600"></i> Xác Thực Định Danh Trực Tuyến (eKYC)
                    </h3>
                    <p className="text-xs text-slate-600">
                      Vui lòng cung cấp hình ảnh chụp thực tế Căn cước công dân (mặt trước và mặt sau) để hệ thống ghi nhận hồ sơ.
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                      {/* CCCD Mặt Trước */}
                      <div className="border-2 border-dashed border-slate-300 hover:border-red-500 rounded-xl p-4 text-center bg-slate-50 transition-all relative overflow-hidden">
                        {cccdFront ? (
                          <div className="space-y-2">
                            <img src={cccdFront} alt="CCCD Mặt trước" className="w-full h-32 object-cover rounded-lg border border-red-200" />
                            <label className="text-[11px] text-red-600 font-semibold cursor-pointer block hover:underline">
                              Thay đổi ảnh khác
                              <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'front')} className="hidden" />
                            </label>
                          </div>
                        ) : (
                          <label className="cursor-pointer block py-3">
                            <i data-lucide="upload-cloud" className="w-8 h-8 text-red-600 mx-auto mb-2"></i>
                            <p className="text-xs font-semibold text-slate-800">CCCD Mặt Trước</p>
                            <span className="text-[10px] text-slate-500 block mt-1">Chụp hoặc tải lên ảnh rõ nét</span>
                            <span className="mt-3 inline-block bg-white hover:bg-slate-100 text-red-600 text-xs px-3 py-1.5 rounded-lg border border-slate-200 font-medium shadow-xs">
                              Tải ảnh lên
                            </span>
                            <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'front')} className="hidden" />
                          </label>
                        )}
                      </div>

                      {/* CCCD Mặt Sau */}
                      <div className="border-2 border-dashed border-slate-300 hover:border-red-500 rounded-xl p-4 text-center bg-slate-50 transition-all relative overflow-hidden">
                        {cccdBack ? (
                          <div className="space-y-2">
                            <img src={cccdBack} alt="CCCD Mặt sau" className="w-full h-32 object-cover rounded-lg border border-red-200" />
                            <label className="text-[11px] text-red-600 font-semibold cursor-pointer block hover:underline">
                              Thay đổi ảnh khác
                              <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'back')} className="hidden" />
                            </label>
                          </div>
                        ) : (
                          <label className="cursor-pointer block py-3">
                            <i data-lucide="upload-cloud" className="w-8 h-8 text-rose-600 mx-auto mb-2"></i>
                            <p className="text-xs font-semibold text-slate-800">CCCD Mặt Sau</p>
                            <span className="text-[10px] text-slate-500 block mt-1">Chụp hoặc tải lên ảnh rõ nét</span>
                            <span className="mt-3 inline-block bg-white hover:bg-slate-100 text-rose-600 text-xs px-3 py-1.5 rounded-lg border border-slate-200 font-medium shadow-xs">
                              Tải ảnh lên
                            </span>
                            <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'back')} className="hidden" />
                          </label>
                        )}
                      </div>
                    </div>

                    <div className="bg-red-50 border border-red-200 rounded-xl p-4 mt-4 text-xs text-red-900">
                      Hệ thống đã sẵn sàng tiếp nhận hồ sơ đăng ký hạn mức từ <strong>30.000.000đ đến 100.000.000đ</strong> của Quý khách.
                    </div>

                    {isAnalyzing ? (
                      <div className="py-6 text-center space-y-3">
                        <i data-lucide="refresh-cw" className="w-8 h-8 text-red-600 animate-spin mx-auto"></i>
                        <p className="text-sm font-semibold text-red-600">
                          Đang xử lý và mã hóa thông tin... {analysisProgress}%
                        </p>
                      </div>
                    ) : (
                      <div className="pt-4 flex justify-between">
                        <button
                          onClick={() => setCurrentStep(2)}
                          className="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-200"
                        >
                          Quay lại
                        </button>
                        <button
                          disabled={!cccdFront || !cccdBack}
                          onClick={triggerAutoApproval}
                          className="bg-gradient-to-r from-red-600 to-rose-600 disabled:opacity-40 text-white font-bold px-7 py-2.5 rounded-xl flex items-center gap-2 text-sm shadow-md shadow-red-600/20 hover:from-red-700 hover:to-rose-700"
                        >
                          <i data-lucide="zap" className="w-4 h-4"></i> Xác Nhận Gửi Hồ Sơ
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* STEP 4 - HIỆU ỨNG 3D NỔI BẬT */}
                {currentStep === 4 && approvalResult && (
                  <div className="py-2">
                    <div className="bg-white border-2 border-red-200 rounded-3xl p-6 text-center space-y-5 shadow-[0_20px_50px_rgba(220,38,38,0.15)] transform transition-all relative overflow-hidden">
                      {/* Hiệu ứng ánh sáng 3D góc trên */}
                      <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-red-500 via-rose-500 to-red-600"></div>

                      <div className="w-16 h-16 bg-gradient-to-br from-red-500 to-rose-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-red-500/40 transform -rotate-3 hover:rotate-0 transition-transform">
                        <i data-lucide="smartphone" className="w-8 h-8"></i>
                      </div>
                      
                      <div>
                        <span className="text-xs uppercase tracking-widest text-red-600 font-extrabold bg-red-50 px-3 py-1 rounded-full border border-red-200">
                          Yêu cầu hoàn tất định danh số
                        </span>
                        <h3 className="text-2xl font-black text-slate-900 mt-3 leading-tight">
                          Vui Lòng Tải Ứng Dụng Tikluy Để Hoàn Tất Hồ Sơ!
                        </h3>
                      </div>

                      <p className="text-xs text-slate-600 leading-relaxed px-2">
                        Hồ sơ đề xuất vay của Quý khách (<strong className="text-red-600 font-bold">{formatVND(approvalResult.amount)}</strong>) đã được ghi nhận trên hệ thống. Để tiếp tục quy trình xét duyệt và giải ngân tự động, xin vui lòng cài đặt ứng dụng <strong className="text-slate-900 font-bold">Tikluy</strong>, tiến hành <strong className="text-slate-900 font-bold">nhập lại thông tin</strong> và sử dụng mã giới thiệu bên dưới.
                      </p>

                      {/* Hộp mã giới thiệu nổi bật 3D */}
                      <div className="bg-gradient-to-br from-slate-900 to-slate-950 text-white p-5 rounded-2xl space-y-2 shadow-xl border border-slate-800 relative">
                        <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-red-600 text-white text-[10px] font-bold uppercase px-3 py-0.5 rounded-full shadow-sm">
                          Mã ưu tiên độc quyền
                        </div>
                        <p className="text-xs text-slate-400 uppercase font-semibold pt-1">Mã giới thiệu nhân viên hỗ trợ:</p>
                        <div className="text-3xl font-black text-red-500 tracking-widest font-mono py-1 drop-shadow-md">
                          0878665588
                        </div>
                      </div>

                      {/* Nút tải app iOS và Android chuẩn 3D */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                        <a 
                          href="https://apps.apple.com/vn/app/tikluy/id6504506939" 
                          target="_blank" 
                          className="bg-slate-900 hover:bg-slate-800 text-white p-4 rounded-2xl flex items-center justify-center gap-3 transition-all transform hover:-translate-y-0.5 shadow-md group"
                        >
                          <i data-lucide="apple" className="w-6 h-6 text-white group-hover:scale-110 transition-transform"></i>
                          <div className="text-left">
                            <p className="text-[10px] text-slate-400 uppercase font-medium leading-none">Tải về trên</p>
                            <p className="text-sm font-bold text-white">App Store (iOS)</p>
                          </div>
                        </a>

                        <a 
                          href="https://play.google.com/store/apps/details?id=com.tikluy" 
                          target="_blank" 
                          className="bg-white hover:bg-slate-50 text-slate-900 border-2 border-slate-200 p-4 rounded-2xl flex items-center justify-center gap-3 transition-all transform hover:-translate-y-0.5 shadow-md group"
                        >
                          <i data-lucide="play" className="w-6 h-6 text-red-600 group-hover:scale-110 transition-transform fill-red-600"></i>
                          <div className="text-left">
                            <p className="text-[10px] text-slate-500 uppercase font-medium leading-none">Tải về trên</p>
                            <p className="text-sm font-bold text-slate-900">Google Play</p>
                          </div>
                        </a>
                      </div>

                      <div className="pt-2">
                        <button
                          onClick={() => {
                            setCurrentStep(1);
                          }}
                          className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-xl transition-all border border-slate-200 shadow-xs"
                        >
                          Quay lại trang chủ đăng ký
                        </button>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
