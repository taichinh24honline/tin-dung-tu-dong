<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tikluycredit - Hệ Thống Duyệt Tín Dụng Tự Động</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentStep, setCurrentStep] = useState(1);
      
      // Loan Amount Selection State
      const [loanAmount, setLoanAmount] = useState(50000000);
      const [loanTerm, setLoanTerm] = useState(12);

      // Application Form State
      const [formData, setFormData] = useState({
        fullName: '',
        idCard: '',
        phone: '',
        dob: '',
        email: '',
        jobType: 'employee',
        monthlyIncome: '15000000',
        companyName: '',
        address: '',
        bankName: 'MBBank',
        bankAccount: '',
        accountHolder: ''
      });

      // Real Photo Upload State
      const [cccdFront, setCccdFront] = useState(null);
      const [cccdBack, setCccdBack] = useState(null);

      // Simulation State
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisProgress, setAnalysisProgress] = useState(0);
      const [approvalResult, setApprovalResult] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentStep, isAnalyzing, approvalResult, cccdFront, cccdBack]);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleFileUpload = (e, side) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (side === 'front') {
              setCccdFront(reader.result);
            } else {
              setCccdBack(reader.result);
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const formatVND = (num) => {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);
      };

      const triggerAutoApproval = () => {
        setIsAnalyzing(true);
        setAnalysisProgress(0);

        const interval = setInterval(() => {
          setAnalysisProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setIsAnalyzing(false);

              const resultObj = {
                id: `TK-${Math.floor(10000 + Math.random() * 90000)}`,
                fullName: formData.fullName || 'Khách hàng',
                amount: Number(loanAmount),
                term: Number(loanTerm),
                date: new Date().toISOString().split('T')[0]
              };

              setApprovalResult(resultObj);
              setCurrentStep(4);
              return 100;
            }
            return prev + 20;
          });
        }, 300);
      };

      return (
        <div>
          {/* Header */}
          <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <img 
                  src="./Logo Tikluy.jpeg" 
                  alt="Tikluy Logo" 
                  className="h-11 w-auto object-contain"
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = "https://via.placeholder.com/130x45?text=Tikluycredit";
                  }}
                />
                <div>
                  <p className="text-xs text-slate-500 font-medium leading-tight">Hệ thống Duyệt Tín Dụng Tự Động</p>
                </div>
              </div>

              <div className="flex items-center gap-2 bg-red-50 border border-red-200 px-3.5 py-2 rounded-xl text-xs text-red-600 font-bold shadow-xs">
                <i data-lucide="zap" className="w-4 h-4"></i>
                Hỗ trợ 24/7
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 pt-6">
            <div className="space-y-6">

              {/* Main Multi-Step Form Card */}
              <div className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-md relative">

                {/* STEP 1 */}
                {currentStep === 1 && (
                  <div className="space-y-6">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2.5 border-b border-slate-100 pb-3">
                      <i data-lucide="wallet" className="w-5 h-5 text-red-600"></i> Lựa Chọn Hạn Mức & Thông Tin Định Danh
                    </h3>

                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-5">
                      <div className="space-y-3">
                        <div className="flex justify-between items-center text-sm">
                          <span className="text-slate-600 font-medium">Số tiền đề xuất vay:</span>
                          <span className="text-red-600 font-extrabold text-lg">
                            {formatVND(loanAmount)}
                          </span>
                        </div>
                        <input
                          type="range"
                          min="30000000"
                          max="100000000"
                          step="5000000"
                          value={loanAmount}
                          onChange={(e) => setLoanAmount(Number(e.target.value))}
                          className="w-full accent-red-600 h-2.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                        />
                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                          <span>30 Triệu</span>
                          <span>60 Triệu</span>
                          <span>100 Triệu</span>
                        </div>
                      </div>

                      <div className="space-y-2.5">
                        <label className="text-xs text-slate-700 font-semibold block uppercase tracking-wide">Kỳ hạn thanh toán mong muốn</label>
                        <div className="grid grid-cols-4 gap-2.5">
                          {[6, 12, 18, 24].map((term) => (
                            <button
                              key={term}
                              onClick={() => setLoanTerm(term)}
                              className={`py-3 text-sm font-bold rounded-xl border transition-all ${
                                loanTerm === term
                                  ? 'bg-red-600 text-white border-red-600 shadow-md shadow-red-600/20'
                                  : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                              }`}
                            >
                              {term} Tháng
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Họ và Tên (Khớp CCCD)</label>
                        <input
                          type="text"
                          name="fullName"
                          placeholder="NGUYEN VAN A"
                          value={formData.fullName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white shadow-xs"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Số CCCD (12 chữ số)</label>
                        <input
                          type="text"
                          name="idCard"
                          placeholder="038090001234"
                          maxLength={12}
                          value={formData.idCard}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white shadow-xs"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Số Điện Thoại Chính Chủ</label>
                        <input
                          type="tel"
                          name="phone"
                          placeholder="0987654321"
                          value={formData.phone}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white shadow-xs"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Địa chỉ Email</label>
                        <input
                          type="email"
                          name="email"
                          placeholder="nguyenvana@gmail.com"
                          value={formData.email}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white shadow-xs"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Địa chỉ thường trú hiện tại</label>
                      <input
                        type="text"
                        name="address"
                        placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"
                        value={formData.address}
                        onChange={handleInputChange}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:outline-none focus:border-red-600 focus:bg-white shadow-xs"
                      />
                    </div>

                    <div className="pt-4 flex justify-end">
                      <button
                        onClick={() => setCurrentStep(2)}
                        disabled={!formData.fullName || !formData.idCard || !formData.phone}
                        className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold px-8 py-3.5 rounded-xl transition-all flex items-center gap-2 text-base shadow-lg shadow-red-600/25"
                      >
                        Tiếp Theo <i data-lucide="chevron-right" className="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 2 */}
                {currentStep === 2 && (
                  <div className="space-y-5">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2.5 border-b border-slate-100 pb-3">
                      <i data-lucide="building-2" className="w-5 h-5 text-red-600"></i> Thông Tin Việc Làm & Tài Khoản Nhận Tiền
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Hình thức công việc</label>
                        <select
                          name="jobType"
                          value={formData.jobType}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:bg-white shadow-xs"
                        >
                          <option value="employee">Nhân viên văn phòng / Hợp đồng lao động</option>
                          <option value="business">Kinh doanh tự do / Hộ kinh doanh</option>
                          <option value="freelance">Freelance / Lao động tự do</option>
                          <option value="driver">Tài xế công nghệ / Giao hàng</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Mức thu nhập hàng tháng</label>
                        <select
                          name="monthlyIncome"
                          value={formData.monthlyIncome}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:bg-white shadow-xs"
                        >
                          <option value="8000000">Dưới 10,000,000 đ</option>
                          <option value="15000000">10,000,000 - 20,000,000 đ</option>
                          <option value="25000000">20,000,000 - 35,000,000 đ</option>
                          <option value="40000000">Trên 35,000,000 đ</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Tên đơn vị công tác / Cửa hàng</label>
                        <input
                          type="text"
                          name="companyName"
                          placeholder="Tên cơ quan / công ty..."
                          value={formData.companyName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:bg-white shadow-xs"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Ngân hàng thụ hưởng giải ngân</label>
                        <select
                          name="bankName"
                          value={formData.bankName}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:bg-white shadow-xs"
                        >
                          <optgroup label="Ngân hàng TMCP lớn">
                            <option value="MBBank">MBBank - Ngân hàng Quân Đội</option>
                            <option value="VPBank">VPBank - Ngân hàng Thịnh Vượng</option>
                            <option value="Techcombank">Techcombank - Kỹ Thương</option>
                            <option value="Vietcombank">Vietcombank - Ngoại Thương</option>
                            <option value="ACB">ACB - Ngân hàng Á Châu</option>
                            <option value="TPBank">TPBank - Tiên Phong</option>
                            <option value="BIDV">BIDV - Đầu Tư và Phát Triển</option>
                            <option value="Agribank">Agribank - Nông Nghiệp</option>
                            <option value="VietinBank">VietinBank - Công Thương</option>
                            <option value="Sacombank">Sacombank - Sài Gòn Thương Tín</option>
                            <option value="SHB">SHB - Sài Gòn - Hà Nội</option>
                            <option value="VIB">VIB - Quốc Tế</option>
                            <option value="HDBank">HDBank - Phát Triển TP.HCM</option>
                            <option value="MSB">MSB - Hàng Hải</option>
                            <option value="OCB">OCB - Phương Đông</option>
                            <option value="SeABank">SeABank - Đông Nam Á</option>
                            <option value="Eximbank">Eximbank - Xuất Nhập Khẩu</option>
                            <option value="LPBank">LPBank - Lộc Phát</option>
                          </optgroup>
                          <optgroup label="Ngân hàng số & Tổ chức tài chính">
                            <option value="CakeByVPBank">Cake by VPBank</option>
                            <option value="Timo">Timo by Ban Viet</option>
                            <option value="UBank">Ubank by VPBank</option>
                            <option value="ShinhanFinance">Shinhan Finance</option>
                            <option value="LotteFinance">Lotte Finance</option>
                            <option value="FECredit">FE Credit</option>
                            <option value="HomeCredit">Home Credit</option>
                          </optgroup>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Số tài khoản ngân hàng chính chủ</label>
                        <input
                          type="text"
                          name="bankAccount"
                          placeholder="Nhập số tài khoản..."
                          value={formData.bankAccount}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 focus:bg-white shadow-xs"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block uppercase tracking-wide">Tên chủ tài khoản (Viết hoa không dấu)</label>
                        <input
                          type="text"
                          name="accountHolder"
                          placeholder="VD: NGUYEN VAN A"
                          value={formData.accountHolder}
                          onChange={handleInputChange}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base text-slate-900 uppercase focus:bg-white shadow-xs"
                        />
                      </div>
                    </div>

                    <div className="pt-4 flex justify-between">
                      <button
                        onClick={() => setCurrentStep(1)}
                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-3.5 rounded-xl text-sm"
                      >
                        Quay lại
                      </button>
                      <button
                        onClick={() => setCurrentStep(3)}
                        disabled={!formData.bankAccount || !formData.accountHolder}
                        className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold px-8 py-3.5 rounded-xl flex items-center gap-2 text-base shadow-lg shadow-red-600/25"
                      >
                        Tiếp Theo <i data-lucide="chevron-right" className="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 3 */}
                {currentStep === 3 && (
                  <div className="space-y-5">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2.5 border-b border-slate-100 pb-3">
                      <i data-lucide="credit-card" className="w-5 h-5 text-red-600"></i> Xác Thực Định Danh Trực Tuyến (eKYC)
                    </h3>
                    <p className="text-sm text-slate-600">
                      Vui lòng cung cấp hình ảnh chụp thực tế Căn cước công dân (mặt trước và mặt sau) để hệ thống ghi nhận hồ sơ.
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">
                      {/* CCCD Mặt Trước */}
                      <div className="border-2 border-dashed border-slate-300 hover:border-red-500 rounded-2xl p-6 text-center bg-slate-50 transition-all relative overflow-hidden">
                        {cccdFront ? (
                          <div className="space-y-3">
                            <img src={cccdFront} alt="CCCD Mặt trước" className="w-full h-40 object-cover rounded-xl border border-red-200" />
                            <label className="text-xs text-red-600 font-bold cursor-pointer block hover:underline">
                              Thay đổi ảnh khác
                              <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'front')} className="hidden" />
                            </label>
                          </div>
                        ) : (
                          <label className="cursor-pointer block py-4">
                            <i data-lucide="upload-cloud" className="w-10 h-10 text-red-600 mx-auto mb-3"></i>
                            <p className="text-sm font-bold text-slate-800">CCCD Mặt Trước</p>
                            <span className="text-xs text-slate-500 block mt-1">Chụp hoặc tải lên ảnh rõ nét</span>
                            <span className="mt-4 inline-block bg-white hover:bg-slate-100 text-red-600 text-xs px-4 py-2 rounded-xl border border-slate-200 font-bold shadow-xs">
                              Tải ảnh lên
                            </span>
                            <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'front')} className="hidden" />
                          </label>
                        )}
                      </div>

                      {/* CCCD Mặt Sau */}
                      <div className="border-2 border-dashed border-slate-300 hover:border-red-500 rounded-2xl p-6 text-center bg-slate-50 transition-all relative overflow-hidden">
                        {cccdBack ? (
                          <div className="space-y-3">
                            <img src={cccdBack} alt="CCCD Mặt sau" className="w-full h-40 object-cover rounded-xl border border-red-200" />
                            <label className="text-xs text-red-600 font-bold cursor-pointer block hover:underline">
                              Thay đổi ảnh khác
                              <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'back')} className="hidden" />
                            </label>
                          </div>
                        ) : (
                          <label className="cursor-pointer block py-4">
                            <i data-lucide="upload-cloud" className="w-10 h-10 text-rose-600 mx-auto mb-3"></i>
                            <p className="text-sm font-bold text-slate-800">CCCD Mặt Sau</p>
                            <span className="text-xs text-slate-500 block mt-1">Chụp hoặc tải lên ảnh rõ nét</span>
                            <span className="mt-4 inline-block bg-white hover:bg-slate-100 text-rose-600 text-xs px-4 py-2 rounded-xl border border-slate-200 font-bold shadow-xs">
                              Tải ảnh lên
                            </span>
                            <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'back')} className="hidden" />
                          </label>
                        )}
                      </div>
                    </div>

                    <div className="bg-red-50 border border-red-200 rounded-2xl p-4 mt-4 text-sm text-red-900 font-medium">
                      Hệ thống đã sẵn sàng tiếp nhận hồ sơ đăng ký hạn mức từ <strong>30.000.000đ đến 100.000.000đ</strong> của Quý khách.
                    </div>

                    {isAnalyzing ? (
                      <div className="py-8 text-center space-y-3">
                        <i data-lucide="refresh-cw" className="w-10 h-10 text-red-600 animate-spin mx-auto"></i>
                        <p className="text-base font-bold text-red-600">
                          Đang xử lý và mã hóa thông tin... {analysisProgress}%
                        </p>
                      </div>
                    ) : (
                      <div className="pt-4 flex justify-between">
                        <button
                          onClick={() => setCurrentStep(2)}
                          className="bg-slate-100 text-slate-700 px-6 py-3.5 rounded-xl text-sm font-bold hover:bg-slate-200"
                        >
                          Quay lại
                        </button>
                        <button
                          disabled={!cccdFront || !cccdBack}
                          onClick={triggerAutoApproval}
                          className="bg-gradient-to-r from-red-600 to-rose-600 disabled:opacity-40 text-white font-bold px-8 py-3.5 rounded-xl flex items-center gap-2 text-base shadow-lg shadow-red-600/25 hover:from-red-700 hover:to-rose-700"
                        >
                          <i data-lucide="zap" className="w-5 h-5"></i> Gửi Hồ Sơ & Tiếp Tục
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* STEP 4: MÀN HÌNH YÊU CẦU TẢI ỨNG DỤNG (KẾT QUẢ) */}
                {currentStep === 4 && approvalResult && (
                  <div className="py-2">
                    <div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 text-center space-y-6 shadow-[0_15px_35px_rgba(0,0,0,0.08)] transform transition-all relative overflow-hidden">
                      <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-red-500 via-rose-500 to-red-600"></div>

                      {/* Logo chuẩn chữ nhật ở thẻ thông báo */}
                      <img 
                        src="./Logo Tikluy.jpeg" 
                        alt="Tikluy Logo" 
                        className="h-14 w-auto object-contain mx-auto"
                        onError={(e) => {
                          e.target.onerror = null;
                          e.target.src = "https://via.placeholder.com/130x45?text=Tikluy";
                        }}
                      />
                      
                      <div className="space-y-2">
                        <span className="text-xs uppercase tracking-widest text-red-600 font-extrabold bg-red-50 px-4 py-1.5 rounded-full border border-red-100">
                          Yêu cầu hoàn tất định danh số
                        </span>
                        <h3 className="text-2xl font-extrabold text-slate-900 leading-tight pt-2">
